name: ISKBets — stock fetch

# Scheduling lives at cron-job.org now (see README/CLAUDE.md). GitHub
# Actions' schedule was unreliable enough on free-tier public repos
# (~12% delivery during business hours) that we moved the recurring
# trigger to a dedicated cron service. This workflow is kept as a
# manual fallback only — `workflow_dispatch` exposes a "Run workflow"
# button on the Actions tab so we can fire one off from the GitHub UI
# if cron-job.org is ever down (or to test the auth path without
# logging into cron-job.org).
on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/trigger
        run: |
          curl https://www.iskbets.se/api/trigger \
            --header "x-trigger-secret: ${{ secrets.TRIGGER_SECRET }}" \
            --max-time 90 \
            --fail-with-body \
            --silent \
            --show-error
